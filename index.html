<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<button onclick="copyText()">Скопировать</button>

<script>
function copyText() {
  navigator.clipboard.writeText("Текст скопирован");
  Telegram.WebApp.showAlert("Скопировано");
}
</script>

</body>
</html>
